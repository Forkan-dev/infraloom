<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- the infinity, drawn like the "oo" in the Infraloom wordmark: one stroke, two open ends near the cross -->
    <path id="inf" d="M -50 50
      C -110 110, -165 150, -235 150
      C -320 150, -380 85, -380 0
      C -380 -85, -315 -150, -230 -150
      C -140 -150, -60 -60, 0 0
      C 60 60, 140 150, 230 150
      C 315 150, 380 85, 380 0
      C 380 -85, 320 -150, 235 -150
      C 165 -150, 110 -110, 50 -50"/>

    <radialGradient id="bgGlow" cx="1370" cy="540" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2fa8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#0d1d72" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#071140" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="960" cy="540" r="1150" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#040a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#030822" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="core" x1="-380" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.5" stop-color="#4A82FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>

    <filter id="bloomWide" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="bloomMid" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="bloomTight" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <!-- background -->
  <rect width="1920" height="1080" fill="#071140"/>
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- faint echo rings for depth -->
  <g transform="translate(1370 540) scale(1.32)" fill="none" stroke="#2F6BFF" stroke-linecap="round" filter="url(#haze)">
    <use href="#inf" stroke-width="2" opacity="0.10"/>
  </g>
  <g transform="translate(1370 540) scale(1.62)" fill="none" stroke="#2F6BFF" stroke-linecap="round" filter="url(#haze)">
    <use href="#inf" stroke-width="1.5" opacity="0.05"/>
  </g>

  <!-- neon infinity -->
  <g transform="translate(1370 540) scale(1.05)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#inf" stroke="#1E4BFF" stroke-width="60" opacity="0.45" filter="url(#bloomWide)"/>
    <use href="#inf" stroke="#2F6BFF" stroke-width="30" opacity="0.75" filter="url(#bloomMid)"/>
    <use href="#inf" stroke="#3D78FF" stroke-width="18" filter="url(#bloomTight)"/>
    <use href="#inf" stroke="url(#core)" stroke-width="13"/>
    <use href="#inf" stroke="#BFD3FF" stroke-width="4.5" opacity="0.9"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
